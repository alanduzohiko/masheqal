name: Masheqal Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Accept licenses and install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          rm -rf "$ANDROID_SDK_ROOT/platforms/android-37"
          ln -s "android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle configuration
        run: gradle --version && gradle :app:tasks --all --no-daemon

      - name: Inspect Sorani translation catalog
        run: python3 tools/fetch_sorani_translation.py --inspect-only

      - name: Validate content and resources
        run: python3 tools/validate_project.py

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build unsigned release artifacts
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masheqal-android-artifacts
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/**
