name: Masheqal Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle configuration
        run: gradle --version && gradle :app:tasks --all --no-daemon

      - name: Validate content and resources
        run: python3 tools/validate_project.py

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build unsigned release artifacts
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masheqal-android-artifacts
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/**
