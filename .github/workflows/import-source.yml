name: Import Masheqal Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s .bootstrap/source.tar.xz
          rm -rf /tmp/masheqal-src
          mkdir -p /tmp/masheqal-src
          tar -xJf .bootstrap/source.tar.xz -C /tmp/masheqal-src
          test -d /tmp/masheqal-src/src/source
          cp -a /tmp/masheqal-src/src/source/. .
          rm -rf .bootstrap /tmp/masheqal-src
          # GitHub Actions' token cannot push workflow files without workflows scope.
          # Keep the source workflow out of this commit; it will be restored separately
          # through the connected GitHub integration after the source import lands.
          rm -f .github/workflows/android-build.yml
          rm -f BOOTSTRAP_PLACEHOLDER.md IMPORT_TRIGGER.txt IMPORT_TRIGGER_2.txt .github/workflows/import-source.yml
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Masheqal Android source" || exit 0
          git push
