name: Import Masheqal Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          # payload-31 is the real final chunk; payload-32..46 were duplicate
          # uploads and must not be included in the archive.
          cat .bootstrap/payload-{01..31}.b64 > /tmp/masheqal.tar.xz.b64
          base64 -d /tmp/masheqal.tar.xz.b64 > /tmp/masheqal.tar.xz
          test -s /tmp/masheqal.tar.xz
          rm -rf /tmp/masheqal-src
          mkdir -p /tmp/masheqal-src
          tar -xJf /tmp/masheqal.tar.xz -C /tmp/masheqal-src
          cp -a /tmp/masheqal-src/src/source/. .
          rm -rf .bootstrap /tmp/masheqal-src /tmp/masheqal.tar.xz /tmp/masheqal.tar.xz.b64
          rm -f BOOTSTRAP_PLACEHOLDER.md .github/workflows/import-source.yml
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Masheqal Android source" || exit 0
          git push
